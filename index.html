<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos（カイロス）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ecf2f4;
  --sheet: #ffffff;
  --ink: #0f2531;
  --sub: #4e6571;
  --faint: #84979f;
  --rule: #d5e0e5;
  --press: #e1eaee;
  --accent: #0c5c75;
  --accent-soft: #dfedf1;
  --gold: #b07a12;
  --bg-glow: radial-gradient(120% 70% at 50% 30%, #f7f9f8 0%, #e9f2f3 55%, #d6e9ec 100%);
  --alert: #bd1e2c;
  --alert-soft: #fbeceb;
  --caution: #93600a;
  --caution-soft: #f8efdc;
  --ok: #2a7548;
  --t-gl: #0c5c75;
  --t-pp: #1f6e63;
  --t-dr: #9a4f12;
  --a1: #3d5a99;
  --a2: #2f7c70;
  --a3: #ad5d28;
  --a4: #71508a;
  --a5: #6a7a28;
  --a6: #a23a52;
  --a7: #5f6b7a;
  --f-body:
    "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic",
    sans-serif;
  --f-doc: var(--f-body);
  --r: 6px;
  --nav-h: 56px;
  --fs: 1;
  --on-accent: #ffffff;
  --on-alert: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #04192a;
    --sheet: #0b2636;
    --ink: #e4f0f4;
    --sub: #9bb3bf;
    --faint: #67828f;
    --rule: #18394a;
    --press: #12324430;
    --accent: #5cc9df;
    --accent-soft: #0f3a4c;
    --on-accent: #032130;
    --gold: #f2b84b;
    --bg-glow: radial-gradient(130% 70% at 50% 18%, #0a4258 0%, #05283b 45%, #021522 100%);
    --on-alert: #2a0b0b;
    --alert: #ff8f86;
    --alert-soft: #3d2224;
    --caution: #f2b84b;
    --caution-soft: #3a2f17;
    --ok: #7fd3a0;
    --t-gl: #5cc9df;
    --t-pp: #6ccfbf;
    --t-dr: #eba56b;
    --a1: #4a68a8;
    --a2: #317f73;
    --a3: #a85e2e;
    --a4: #7a5a94;
    --a5: #6a7b2c;
    --a6: #a5465d;
    --a7: #5d6878;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #04192a;
  --sheet: #0b2636;
  --ink: #e4f0f4;
  --sub: #9bb3bf;
  --faint: #67828f;
  --rule: #18394a;
  --press: #12324430;
  --accent: #5cc9df;
  --accent-soft: #0f3a4c;
  --on-accent: #032130;
  --gold: #f2b84b;
  --bg-glow: radial-gradient(130% 70% at 50% 18%, #0a4258 0%, #05283b 45%, #021522 100%);
  --on-alert: #2a0b0b;
  --alert: #ff8f86;
  --alert-soft: #3d2224;
  --caution: #f2b84b;
  --caution-soft: #3a2f17;
  --ok: #7fd3a0;
  --t-gl: #5cc9df;
  --t-pp: #6ccfbf;
  --t-dr: #eba56b;
  --a1: #4a68a8;
  --a2: #317f73;
  --a3: #a85e2e;
  --a4: #7a5a94;
  --a5: #6a7b2c;
  --a6: #a5465d;
  --a7: #5d6878;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}
body {
  background: var(--paper) var(--bg-glow) fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: calc(15px * var(--fs));
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  font-feature-settings: "palt" 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#splash {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #021a2a;
  transition: opacity 0.55s ease;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) #splash {
    background: #eef5f6;
  }
}
:root[data-theme="light"] #splash {
  background: #eef5f6;
}
#splash img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#splash .sp-logo {
  opacity: 0;
  animation: sp-in 0.9s ease-out 0.15s forwards;
}
#splash.out {
  opacity: 0;
  pointer-events: none;
}
@keyframes sp-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  #splash .sp-logo {
    animation: none;
    opacity: 1;
  }
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
.mono {
  font-variant-numeric: tabular-nums;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px;
}
svg.i {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
}
.top {
  position: relative;
  flex: none;
  z-index: 5;
  max-height: 78%;
  overflow-y: auto;
  background: transparent;
  border-bottom: 1px solid var(--rule);
}
.scroller {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.top .wrap {
  display: grid;
  gap: 6px;
  padding-top: 12px;
  padding-bottom: 10px;
}
.top[data-tab="feed"] .wrap {
  padding-bottom: 0;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
}
h1 {
  margin: 0;
  font-family: "Avenir Next", "Futura", "Segoe UI", "Helvetica Neue", var(--f-body);
  font-size: 23px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
  line-height: 1.3;
}
.run {
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.feedbar {
  display: flex;
  align-items: center;
  gap: 8px;
}
.seg {
  display: flex;
  gap: 18px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.seg::-webkit-scrollbar {
  display: none;
}
.seg button {
  flex: none;
  border: 0;
  background: none;
  padding: 9px 0 10px;
  border-radius: 0;
  font-size: 14.5px;
  color: var(--sub);
  box-shadow: inset 0 -2px 0 transparent;
}
.seg button[aria-pressed="true"] {
  color: var(--ink);
  font-weight: 700;
  box-shadow: inset 0 -2px 0 var(--accent);
}
.fbtn {
  flex: none;
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 0;
  background: none;
  border-radius: 8px;
  padding: 8px 6px;
  font-size: 13px;
  color: var(--sub);
}
.fbtn[aria-expanded="true"] {
  color: var(--accent);
}
.fbtn .k {
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 11px;
  line-height: 17px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.fpanel {
  display: grid;
  gap: 8px;
  padding: 2px 0 12px;
}
.fgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.field,
select.field {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--sheet);
  font-size: 16px;
}
.frow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--sub);
}
.frow label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.frow input {
  accent-color: var(--accent);
  margin: 0;
}
.frow .sp {
  flex: 1;
}
.linkbtn {
  border: 0;
  background: none;
  padding: 2px 0;
  color: var(--accent);
  font-size: 13.5px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

main {
  padding: 14px 0 0;
}
main::after {
  content: "";
  display: block;
  height: 40px;
}
.sheet-scroll::after {
  content: "";
  display: block;
  height: calc(32px + env(safe-area-inset-bottom));
}
.grp {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 22px 4px 7px;
  font-size: 13px;
  font-weight: 700;
  color: var(--sub);
  letter-spacing: 0;
}
.grp span {
  font-weight: 400;
  font-size: 12px;
  color: var(--faint);
}
.grp:first-child {
  margin-top: 2px;
}
.grp i {
  flex: none;
  align-self: center;
  width: 4px;
  height: 13px;
  border-radius: 1px;
  background: var(--ac, var(--faint));
}
.list {
  display: grid;
  background: var(--sheet);
  border-radius: var(--r);
  overflow: hidden;
}
.card,
.bcard {
  position: relative;
  display: grid;
  gap: 4px;
  padding: 14px 16px;
  cursor: pointer;
  background: var(--sheet);
}
.list > .card + .card::before,
.list > .bcard + .bcard::before {
  content: "";
  position: absolute;
  top: 0;
  left: 16px;
  right: 0;
  border-top: 1px solid var(--rule);
}
.card:active,
.bcard:active {
  background: var(--press);
}
.card.s-hi::after,
.card.s-acc::after {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--alert);
}
.card.s-acc::after {
  background: var(--accent);
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  font-size: 12px;
  font-weight: 700;
  color: var(--sub);
  white-space: nowrap;
}
.tab::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: var(--ac, var(--a7));
}
.c-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--sub);
  min-width: 0;
  line-height: 1.5;
}
.c-meta .src {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--faint);
}
.c-meta .sp {
  flex: 1;
}
.c-meta .dt {
  flex: none;
  font-variant-numeric: tabular-nums;
  color: var(--sub);
}
.itag {
  display: inline-block;
  margin-left: 6px;
  padding: 0 6px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  font-size: 0.72em;
  font-weight: 500;
  line-height: 1.6;
  color: var(--sub);
  vertical-align: 0.12em;
  white-space: nowrap;
}
.ty {
  flex: none;
  font-weight: 700;
}
.ty.guideline {
  color: var(--t-gl);
}
.ty.paper {
  color: var(--t-pp);
}
.ty.drug {
  color: var(--t-dr);
}
.ty.safety {
  color: var(--alert);
}
.udot {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: -2px;
}
.c-title {
  font-feature-settings: "palt" 1;
  letter-spacing: 0.01em;
  margin: 0;
  font-size: calc(15.5px * var(--fs));
  font-weight: 700;
  line-height: 1.55;
}
.card.read .c-title {
  font-weight: 400;
  color: var(--sub);
}
.c-foot {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 3px;
}
.star {
  flex: none;
  border: 0;
  background: none;
  margin: -10px -10px -10px -4px;
  padding: 10px;
  font-size: 17px;
  line-height: 1;
  color: var(--faint);
}
.star.on {
  color: var(--gold);
}
.bd {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  white-space: nowrap;
  color: var(--sub);
}
.bd.s-hi::before,
.bd.s-acc::before,
.bd.s-mid::before,
.bd.s-lo::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 1px;
  background: currentColor;
}
.bd.s-hi {
  color: var(--alert);
}
.bd.s-acc {
  color: var(--accent);
}
.bd.s-mid {
  color: var(--caution);
}
.bd.s-lo {
  color: var(--faint);
  font-weight: 400;
}
.bd.gr {
  font-weight: 400;
  color: var(--sub);
}
.bd.gr b {
  display: inline-grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 3px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1;
}
.bd.g-A b {
  color: var(--ok);
}
.bd.g-B b {
  color: var(--accent);
}
.bd.g-C b {
  color: var(--caution);
}
.bd.g-D b {
  color: var(--faint);
}
.bd.plain {
  font-weight: 400;
  color: var(--sub);
}
.notice {
  background: var(--sheet);
  border-radius: var(--r);
  padding: 16px;
  font-size: 14px;
  color: var(--sub);
}
.notice strong {
  color: var(--ink);
}
.hint {
  margin: 0 4px 12px;
  font-size: calc(12.5px * var(--fs));
  color: var(--sub);
  line-height: 1.6;
}
.more {
  margin-top: 16px;
  display: grid;
  gap: 8px;
  justify-items: start;
  font-size: 13px;
  color: var(--sub);
  padding: 0 4px;
}
.more .row {
  gap: 8px;
}

.bcard h3 {
  margin: 0;
  font-size: calc(15.5px * var(--fs));
  font-weight: 700;
  line-height: 1.55;
}
.bcard p {
  margin: 0;
  font-size: calc(13.5px * var(--fs));
  color: var(--sub);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.bcard .m {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  color: var(--faint);
}
.bcard .m .sp {
  flex: 1;
}
.bcard.night::after,
.bcard.chronic::after {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 3px;
  background: var(--alert);
}
.bcard.chronic::after {
  background: var(--t-pp);
}

.mgrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.mgrid.c2 { grid-template-columns: repeat(2, 1fr); }
.mbtn {
  position: relative;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  min-height: 58px;
  padding: 8px 6px;
  border: 0;
  border-radius: var(--r);
  background: var(--sheet);
  font-size: calc(15px * var(--fs));
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  text-align: center;
}
.mbtn:active {
  background: var(--press);
}
.mbtn .s {
  font-size: 12px;
  font-weight: 400;
  color: var(--sub);
}
.mbtn.wide {
  min-height: 62px;
  justify-items: start;
  text-align: left;
  padding: 11px 16px 11px 19px;
}
.mbtn.common::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--accent);
}
.mbtn.od {
  box-shadow: inset 0 0 0 2px var(--alert);
  border-radius: 4px;
}
.mbtn.od .t {
  color: var(--alert);
}
.mbtn .dot {
  position: absolute;
  top: 8px;
  right: 9px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--caution);
}
.mstack {
  display: grid;
  gap: 8px;
}
.mode {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--press);
  border-radius: 9px;
  padding: 2px;
  gap: 2px;
}
.mode button {
  border: 0;
  background: none;
  border-radius: 7px;
  padding: 6px 4px;
  font-size: 14px;
  font-weight: 700;
  color: var(--sub);
  display: grid;
  gap: 0;
  line-height: 1.3;
}
.mode button small {
  font-size: 11.5px;
  font-weight: 400;
}
.mode button[aria-pressed="true"] {
  background: var(--sheet);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20, 30, 50, 0.14);
}
.mode button[data-mode="night"][aria-pressed="true"] {
  color: var(--accent);
}
.calc {
  display: grid;
  gap: 10px;
}
.calc label {
  display: grid;
  gap: 3px;
  font-size: 12.5px;
  color: var(--sub);
}
.calc select,
.calc input {
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--paper);
  width: 100%;
  min-width: 0;
}
.calc .r3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.c-out {
  border-radius: 8px;
  padding: 11px 13px;
  background: var(--paper);
  font-size: 14px;
  display: grid;
  gap: 4px;
}
.c-out:empty {
  display: none;
}
.c-out .v {
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.c-out.hi {
  background: var(--sheet);
  box-shadow: inset 0 0 0 2px var(--alert);
}
.c-out.hi .j {
  color: var(--alert);
  font-weight: 700;
}
.c-out.ok .j {
  color: var(--ok);
  font-weight: 700;
}

.bnav {
  position: relative;
  flex: none;
  z-index: 6;
  background: var(--sheet);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
.bnav .in {
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  height: var(--nav-h);
}
.bnav button {
  position: relative;
  border: 0;
  background: none;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 3px;
  font-size: 10.5px;
  color: var(--faint);
  padding: 0;
}
.bnav button svg.i {
  width: 23px;
  height: 23px;
}
.bnav button[aria-current="page"] {
  color: var(--accent);
  font-weight: 700;
}
.bnav .n {
  position: absolute;
  top: 5px;
  left: calc(50% + 8px);
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 10.5px;
  line-height: 17px;
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--paper);
  display: flex;
  flex-direction: column;
}
.sheet-bar {
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}

<script>

    if (!m) return;
    var c = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim();
    if (c) m.setAttribute("content", c);
  }
  fit();
  new MutationObserver(fit).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    var q = matchMedia("(prefers-color-scheme: dark)");
    if (q.addEventListener) q.addEventListener("change", fit);

})();

  const TDP_JA = /トルサード[・･\s]*(?:ド[・･\s]*)?ポ[ワア]ント|トルサード/g;
  const TDP_EN = /torsades?[\s\-]*de[\s\-]*pointes?|torsades?/gi;

  function normStr(t) {
    if (t.indexOf("トルサード") < 0 && !/torsade|TdP/i.test(t)) return t;
    return t
      .split(/(https?:\/\/[^\s)）]+)/)
      .map((seg, i) => (i % 2 ? seg : normSeg(seg)))

  function normSeg(t) {
    return t
      .replace(TDP_JA, "多形性心室頻拍")

      .replace(/多形性心室頻拍[、・\/／]\s*多形性心室頻拍/g, "多形性心室頻拍");
  }
  function normDeep(v, k) {
    if (typeof v === "string") return k === "url" ? v : normStr(v);
    if (Array.isArray(v)) return v.map((x) => normDeep(x));
    if (v && typeof v === "object") {
      const o = {};
      for (const key in v) o[key] = normDeep(v[key], key);

    return v;

  const UNK = /未確認|確認できていない|確認できなかった|確認していない|要確認/;
  const UNK_KEEP = new Set([
    "url",
    "id",
    "key",
    "date",
    "title",
    "titleOriginal",
    "label",
    "name",
    "k",
    "basedOn",
    "currentVersion",
  ]);
  function unkSentences(s) {
    const out = [];
    let cur = "",
      depth = 0;
    for (const ch of s) {
      cur += ch;
      if ("（(「『【".includes(ch)) depth++;
      else if ("）)」』】".includes(ch)) depth = Math.max(0, depth - 1);
      else if (ch === "。" && !depth) {
        out.push(cur);
        cur = "";
      }
    }
    if (cur) out.push(cur);
    return out;
  }
  function unkStr(s) {
    if (!UNK.test(s)) return s;
    s = s
      .replace(/[（(]\s*未確認\s*[）)]/g, "＊")
      .replace(
        /[（(][^（）()]*(?:未確認|確認できていない|確認できなかった|確認していない|要確認)[^（）()]*[）)]/g,
        "",
      );
    return s
      .split("\n")
      .map((line) => {
        if (!UNK.test(line)) return line;
        const m = /^(\s*(?:[-*•]\s+|・\s*|\d+[.)]\s+)?)(.*)$/.exec(line);
        const t = unkSentences(m[2])
          .filter((x) => !UNK.test(x))
          .join("")
          .trim();
        return t ? m[1] + t : null;
      })
      .filter((x) => x !== null)
      .join("\n")
      .trim();
  }
  const DROP = {};
  function scrub(v, k) {
    if (typeof v === "string") return UNK_KEEP.has(k) ? v : unkStr(v);
    if (Array.isArray(v))
      return v.map((x) => scrub(x)).filter((x) => x !== DROP && x !== "" && x != null);
    if (v && typeof v === "object") {
      if (typeof v.h === "string" && UNK.test(v.h)) return DROP;
      const o = {};
      for (const key in v) {
        if (key === "gaps") continue;
        const x = scrub(v[key], key);
        if (x === "" || x === DROP) continue;
        o[key] = x;
      }
      if (("h" in v && "body" in v && !o.body) || ("k" in v && "v" in v && !("v" in o)))
        return DROP;
      return o;
    }
    return v;
  }

  function ensureAll() {
    if (!db || S.allLoaded || S.allLoading) return;
    S.allLoading = true;
    if (S.tab === "feed" && !S.openId) renderMain();
    (async () => {
      let cursor = null;
      for (let i = 0; i < 40; i++) {
        let q = db.collection("items");
        if (cursor) q = q.where("addedAt", "<=", cursor);
        const snap = await q.orderBy("addedAt", "desc").limit(1000).get();
        let fresh = 0;
        snap.docs.forEach((x) => {
          if (x.exists && !extraMap.has(x.id)) {
            extraMap.set(x.id, docOf(x));
            fresh++;
          }
        });
        if (snap.size < 1000 || !fresh) break;
        const last = snap.docs[snap.docs.length - 1].data();
        if (!last || !last.addedAt) break;
        cursor = String(last.addedAt);
      }
    })()
      .then(() => {
        S.allLoaded = true;
        S.allLoading = false;
        afterLoad();
      })
      .catch((err) => {
        S.allLoading = false;
        S.loadNote = dbErr(err, true);
        afterLoad();
      });
  }
  function ensureIds(ids) {
    if (!db || S.allLoaded) return;
    const need = [...new Set(arr(ids))].filter(
      (id) =>
        id && !liveMap.has(id) && !extraMap.has(id) && !pendingIds.has(id) && !missingIds.has(id),
    );
    if (!need.length) return;
    need.forEach((id) => pendingIds.add(id));
    Promise.all(
      need.map((id) =>
        db
          .collection("items")
          .doc(id)
          .get()
          .then((d) => {
            if (d.exists) extraMap.set(id, docOf(d));
            else missingIds.add(id);

      ),
    ).then(() => {
      need.forEach((id) => pendingIds.delete(id));
      afterLoad();
    });
  }

  function glSnip(p, words) {

  function gdRegex(words) {
    const cls = (c) => {
      const code = c.charCodeAt(0);
      if (code >= 0x30a1 && code <= 0x30f6) return "[" + c + String.fromCharCode(code - 0x60) + "]";
      return c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    };
    const pats = words
      .slice()
      .sort((a, b) => b.length - a.length)
      .map((w) => Array.from(w).map(cls).join(""));
    try {
      return new RegExp("(" + pats.join("|") + ")", "gi");
    } catch (e) {
      return null;
    }
  }
  function gdHighlight() {
    const root = $("sheet-body");
    if (!root) return;
    root.querySelectorAll("mark.gd").forEach((m) => m.replaceWith(document.createTextNode(m.textContent)));
    root.normalize();
    S.gdIdx = -1;
    const n = $("gd-n");
    const words = gsWords(S.gFind || "");
    if (!words.length) {
      if (n) n.textContent = "";
      return;
    }
    const re = gdRegex(words);
    if (!re) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (t) => {
        if (!t.parentNode || t.parentNode.closest(".gfind")) return NodeFilter.FILTER_REJECT;
        re.lastIndex = 0;
        return re.test(t.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((t) => {
      const s = t.nodeValue,
        frag = document.createDocumentFragment();
      let last = 0,
        m;
      re.lastIndex = 0;
      while ((m = re.exec(s))) {
        if (!m[0].length) {
          re.lastIndex++;
          continue;
        }
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        const mk = document.createElement("mark");
        mk.className = "gd";
        mk.textContent = m[0];
        frag.appendChild(mk);
        last = m.index + m[0].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
    const ms = root.querySelectorAll("mark.gd");
    ms.forEach((mk) => {
      let d = mk.closest("details");
      while (d) {
        if (!d.open) d.open = true;
        d = d.parentElement && d.parentElement.closest("details");
      }
    });
    if (n) n.textContent = ms.length ? ms.length + "件" : "見つかりません";
  }

  function guideToMarkdown(w) {

    }
    arr(g.recs).forEach((r) => {
      if (r) L.push("", "## " + (r.h || "推奨"), r.body || "");
    });
    if (arr(g.changes).length) {
      L.push("", "## 前版からの主な変更");
      arr(g.changes).forEach((x) => L.push("- " + x));

    const links = [w.url].concat(arr(g.sources).map((l) => l && l.url)).filter(Boolean);

  function calcUpdate() {
    const m = getManual(S.openId);
    const out = $("c-out");
    if (!m || !out) return;
    const c = S.calc,
      d = arr(m.calc).find((x) => x.id === c.drug);
    if (!d) return;
    const wt = parseFloat(c.wt),
      mg = parseFloat(c.mg),
      n = parseFloat(c.n);
    $("c-note").textContent =
      (d.note ? d.note + "。" : "") +
      "推定量は目安です。症状、併用薬、徐放剤、経過時間を合わせて判断してください。";
    out.className = "c-out";
    if (!(mg > 0 && n > 0)) {
      out.innerHTML = "";
      return;
    }
    const tot = mg * n,
      kg = wt > 0 ? tot / wt : null;
    const fmt = (x) =>
      x >= 100 ? Math.round(x).toLocaleString() : (Math.round(x * 10) / 10).toLocaleString();
    let h =
      '<div class="v">総量 ' +
      fmt(tot) +
      " mg" +
      (tot >= 1000 ? "（" + Math.round(tot / 100) / 10 + " g）" : "") +
      (kg != null ? " ／ " + fmt(kg) + " mg/kg" : "") +
      "</div>";
    const steps = arr(d.steps);
    if (steps.length) {
      if (kg == null && steps.some((st) => st.mgkg != null && st.mg == null)) {
        h += "<div>体重を入れると mg/kg で判定します。</div>";
      } else {
        const hit = steps.filter(
          (st) =>
            (st.mgkg != null && kg != null && kg >= st.mgkg) || (st.mg != null && tot >= st.mg),
        );
        if (hit.length) {
          out.className = "c-out hi";
          h += '<div class="j">目安以上：' + esc(hit[hit.length - 1].t) + "</div>";
        } else {
          out.className = "c-out ok";
          h +=
            '<div class="j">目安未満</div><div>目安：' +
            esc(steps[0].t) +
            "</div>" +
            (kg == null ? "<div>体重を入れると mg/kg でも判定します。</div>" : "");
        }
      }
    }
    out.innerHTML = h;
  }

  function branchToMarkdown(b) {
    const L = ["# 分岐点：" + (b.title || ""), ""];
    if (b.question) L.push("**問い**：" + b.question, "");
    if (b.summary) L.push("## 現時点の判断の目安", b.summary, "");
    if (arr(b.options).length) {
      L.push(isDxBranch(b) ? "## 鑑別の候補" : "## 選択肢");
      arr(b.options).forEach((o) => {
        const e = o.dx && DX && DXM[o.dx];
        L.push(
          "- **" +
            (o.label || "") +
            "**" +
            (e && e.c
              ? "（ICD-11 " +
                e.c +
                ((e.i10 || []).length ? "／ICD-10 " + e.i10.join("/") : "") +
                "）"
              : "") +
            "：" +
            (o.when || "") +
            (o.evidence ? "（根拠：" + o.evidence + "）" : ""),
        );
      });
      L.push("");
    }
    accMarkdown(b).forEach((x) => L.push(x));
    const its = branchItems(b);
    if (its.length) {
      L.push("## 根拠");
      its.forEach((it) =>
        L.push(
          "- [" +
            (gradeOf(it) || "-") +
            "] " +
            (it.title || "") +
            (it.decision && it.decision.change ? " → " + it.decision.change : ""),
        ),
      );
    }
    L.push("", "> AI作成。個々の患者への適用は臨床判断で。");
    return L.join("\n");
  }

  function toMarkdown(it) {
    const L = [];
    L.push("# " + (it.title || ""));
    if (it.titleOriginal) L.push("*" + it.titleOriginal + "*");
    L.push("");
    if (it.tldr) {
      L.push("## 要点", it.tldr, "");
    }
    if (arr(it.clinical).length) {
      L.push("## 診療で変わること");
      arr(it.clinical).forEach((x) => L.push("- " + x));
      L.push("");
    }
    if (it.decision && (it.decision.question || it.decision.change)) {
      L.push("## 変わる判断" + (it.decision.strength ? "（" + it.decision.strength + "）" : ""));
      if (it.decision.question) L.push("- 分岐点: " + it.decision.question);
      if (it.decision.change) L.push("- " + it.decision.change);
      L.push("");
    }
    if (gradeOf(it)) {
      L.push("## 信頼度: " + gradeOf(it), CRED_TEXT[gradeOf(it)]);
      arr(it.cred && it.cred.reasons).forEach((r) => L.push("- " + r));
      L.push("");
    }
    L.push(
      "- 種別: " +
        (TYPE_LABEL[kindOf(it)] || it.type || "") +
        " / 臨床" +
        (IMP_LABEL[it.impact] || "") +
        (it.evidence ? " / " + it.evidence : ""),
    );
    L.push(
      "- 日付: " +
        (it.date || "") +
        (it.region ? "（" + it.region + "）" : "") +
        " / 出典: " +
        (it.source || ""),

    if (arr(it.areas).length) L.push("- 領域: " + arr(it.areas).join("、"));
    if (arr(it.facts).length) {
      L.push("", "## 概要", "| 項目 | 内容 |", "|---|---|");
      arr(it.facts).forEach(
        (f) =>
          f &&
          L.push(
            "| " +
              String(f.k || "").replace(/\|/g, "／") +
              " | " +
              String(f.v || "")
                .replace(/\|/g, "／")
                .replace(/\n/g, " ") +
              " |",
          ),
      );
    }
    arr(it.sections).forEach((s) => {

  function pkFind(X, Y) {
    const res = [];
    let si = 0,
      su = 0;
    const inh = [],
      ind = [];
    ENZ.forEach((E) => {
      const iv = (X.i || {})[E] || 0,
        uv = (X.u || {})[E] || 0,
        sv = (Y.s || {})[E] || 0,
        sio = (Y.si || {})[E] || 0,
        pv = Y.pro === E ? 2 : 0;
      if (iv && (sv || pv)) {
        const sc = iv + Math.max(sv, pv);
        if (sc >= 4) {
          inh.push({ E, iv, pro: !sv && !!pv });
          si = Math.max(si, sc);
        }
      }
      if (uv && (sv || sio)) {
        const sc = uv + Math.max(sv, sio);
        if (sc >= 4) {
          ind.push(E);
          su = Math.max(su, sc);
        }
      }
    });
    if (inh.length) {
      const pro = inh.some((x) => x.pro);
      res.push({
        lv: si >= 5 ? "major" : "mod",
        a: X.id,
        b: Y.id,
        tag: "CYP阻害",
        t:
          X.n +
          "がCYP" +
          inh.map((x) => x.E + "を" + ISTR[x.iv]).join("、CYP") +
          "阻害 → " +
          (pro ? Y.n + "の活性化が妨げられ、効果が弱まるおそれ。" : Y.n + "の血中濃度が上昇。") +
          (si >= 5 && Y.adj ? Y.adj : ""),
      });
    }
    if (ind.length)
      res.push({
        lv: su >= 5 ? "major" : "mod",
        a: X.id,
        b: Y.id,
        tag: "CYP誘導",
        t:
          X.n +
          "がCYP" +
          ind.join("・") +
          "を誘導 → " +
          Y.n +
          "の血中濃度が低下（効果減弱）。" +
          X.n +
          "をやめると逆に上昇する。" +
          (Y.adjInd || ""),
      });
    return res;
  }

  function scCalc(s) {
    const a = S.dx.sc[s.id] || [],

      n = idx.length,
      lim = s.sum || n;
    let tot = 0,

    idx.forEach((i, k) => {

      if (v == null) return;

    if (s.rule === "asrs") {
      const pos = s.items.filter((it, i) => a[i] != null && it.th != null && a[i] >= it.th).length;
      if (ans) {
        lab = pos >= 4 ? "陽性：成人ADHDに一致する症状" : "陰性";
        lv = pos >= 4 ? 2 : 0;

      extra = "陽性項目 " + pos + " / 6";

        pos = two >= 2 || three;

        lab = pos ? "運動の要件を満たす：遅発性ジスキネジアの可能性" : "運動の要件を満たさない";
        lv = pos ? 2 : 0;
      }
      extra = "合計は項目1〜7";
    }
    if (s.rule === "cssrs") {
      const y = (i) => a[i] === 1;
      let r = 0;
      if (y(0) || y(1)) r = 1;
      if (y(2) || (y(5) && a[6] !== 1)) r = 2;
      if (y(3) || y(4) || (y(5) && y(6))) r = 3;
      tot = null;
      lab = ans ? ["該当なし", "低リスク", "中等度リスク", "高リスク"][r] : "";
      lv = r;
      extra = ans
        ? [
            "",
            "経過観察と、必要に応じて支援につなぐ",
            "精神科的評価と安全計画",
            "その場で安全を確保し、精神科医が評価する（入院の検討を含む）",
          ][r]
        : "";
      return { tot, ans, n, lab, lv, extra, alerts: [] };
    }
    if (s.rule === "cam") {
      const y = (i) => a[i] === 1,

        ans,
        n,
        lab: ans ? (pos ? "せん妄が示唆される" : "せん妄の判定基準を満たさない") : "",
        lv: pos ? 3 : 0,
        extra: ans
          ? pos
            ? "原因（身体疾患・薬剤・離脱など）の検索と対応を行う"
            : "特徴1・2があり、特徴3又は4があれば陽性"

        alerts: [],

      const e = (i) => a[i] != null && a[i] >= 2,
        c = (f, t) => {

        (ok ? "満たす" : "満たさない") +

        "・回避" +
        c(5, 6) +
        "・認知と気分" +
        c(7, 13) +
        "・覚醒" +
        c(14, 19) +
        "）";
    }
    if (s.rule === "single") {
      const v = a[0];
      tot = v == null ? null : v;
      const o = s.items[0].o.find((o) => o[0] === v);
      lab = o ? o[1] : "";
    }
    if (!ans && s.rule !== "single") tot = null;
    const alerts = (s.alert || [])

      };
      const subItems = (recent) => {
        let q = db.collection("items");
        if (recent) q = q.where("addedAt", ">=", since);
        q.orderBy("addedAt", "desc")
          .limit(1000)
          .onSnapshot(onItems, (err) => {
            if (recent) {
              subItems(false);
              return;
            }
            S.loading = false;
            clearTimeout(loadTimer);
            S.loadNote = dbErr(err, true);
            renderMain();
          });
      };
      subItems(true);
      if (["365", "all"].includes(curP())) ensureAll();
      db.collection("branches")
        .limit(1000)
        .onSnapshot(
          (snap) => {
            S.branches = snap.docs.filter((x) => x.exists).map(docOf);
            refresh("any");
          },
          () => {},
        );
      db.collection("journals").onSnapshot(
        (snap) => {
          S.journals = snap.docs
            .filter((x) => x.exists)
            .map((x) => Object.assign({ id: x.id }, x.data()));
          refresh("item");
        },
        () => {},
      );
      db.collection("manuals").onSnapshot(
        (snap) => {
          S.manuals = snap.docs.filter((x) => x.exists).map(docOf);
          refresh("manual");
        },
        () => {},
      );
      db.doc("meta/status").onSnapshot(
        (s) => {
          S.meta = s.exists ? s.data() : null;
          renderRun();
          if (S.tab === "info" && !quiet()) renderMain();
        },
        () => {},
      );
      db.collection("watch").onSnapshot(
        (snap) => {
          S.watch = snap.docs.filter((x) => x.exists).map(docOf);
          if ((S.tab === "info" || S.tab === "guide") && !quiet()) renderMain();
          if (S.openId && S.openKind === "guide") renderSheet();
        },
        () => {},
      );
      db.collection("tools").onSnapshot(
        (snap) => {
          const first = !S.toolsLoaded;
          snap.docs.forEach((x) => {
            if (x.exists) toolsApply(x.id, normDeep(x.data()));
          });
          S.toolsLoaded = true;
          S.toolsErr = "";
          if (S.tab === "tools" && TOOL_DB.includes(S.tool)) {
            const a = document.activeElement;
            if (
              first ||
              !(a && $("main").contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))
            )
              renderTools();
          }
          if (first && S.tab === "guide" && !String(S.glQ || "").trim() && $("gl-body")) $("gl-body").innerHTML = guidesListHTML();
        },
        (err) => {
          S.toolsErr = dbErr(err, true);
          if (S.tab === "tools") renderTools();
        },
      );
    },
  );
})();
</script>
</body>
</html>
