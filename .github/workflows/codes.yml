name: アクセスコード

on:
  push:
    branches: [main]
    paths: ["k.json", "data/codes.enc", "firestore.rules", ".github/codes/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 準備
        run: |
          pip install --quiet cryptography
          cd .github/codes && npm install --no-audit --no-fund
      - name: 反映
        run: node .github/codes/sync.mjs
        env:
          KAIROS_PASS: ${{ secrets.KAIROS_PASS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
